name: docker-cicd

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t hqdu/dockercicd:latest .

      - name: Push Docker image
        run: docker push hqdu/dockercicd:latest

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest image
        run: docker pull hqdu/dockercicd:latest

      - name: Deploy with Docker Compose
        run: docker compose up -d
