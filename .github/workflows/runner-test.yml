
name: docker-cicd

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        os: [self-hosted]
        node-version: [22.23.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: echo "PORT=${{ secrets.PORT }}" > .env

      - name: build docker image
        run: docker build -t hqdu/dockercicd:latest .
      - name: push docker image
        run: docker push hqdu/dockercicd:latest

  deploy:
    runs-on: self-hosted    
    needs: build

    steps:
      
      - name: runfile docker compose
        run: docker compose -f docker-compose.yml up -d --build
        

      