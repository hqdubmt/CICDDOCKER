name: docker-cicd

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: echo "PORT=${{ secrets.PORT }}" > .env

      - name: Build Docker image
        run: docker build -t hqdu/dockercicd:latest .

      - name: Push Docker image
        run: docker push hqdu/dockercicd:latest

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest image
        run: docker pull hqdu/dockercicd:latest

      - name: Deploy with Docker Compose
        working-directory: /home/hqdu/CICDdocker
        env:
         PORT: ${{ secrets.PORT }}
        run: docker compose up -d --force-recreate

     